name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  skills-and-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # releases/v6, 2026-07-16
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # releases/v6, 2026-06-23
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint (ruff)
        run: python -m ruff check weasley_assistant evals scripts
      - name: Validate skills (community PRs land here)
        run: python scripts/validate_skills.py
      - name: Deterministic evals (offline tier — no API key in CI)
        run: python -m pytest -q evals/deterministic
